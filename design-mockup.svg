<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0454B3"/>
      <stop offset="50%" stop-color="#1589EE"/>
      <stop offset="100%" stop-color="#E8F4FD"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D4E9F7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005290"/>
      <stop offset="100%" stop-color="#1457A6"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#005290" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00A1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="cloudPattern" x="0" y="0" width="100" height="50" patternUnits="userSpaceOnUse">
      <ellipse cx="30" cy="35" rx="25" ry="12" fill="white" opacity="0.6"/>
      <ellipse cx="60" cy="30" rx="20" ry="10" fill="white" opacity="0.5"/>
      <ellipse cx="80" cy="38" rx="22" ry="11" fill="white" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#skyGrad)"/>
  
  <!-- CLOUDS LAYER -->
  <rect x="0" y="0" width="1600" height="600" fill="url(#cloudPattern)" opacity="0.3"/>
  
  <!-- Floating Cloud Platforms -->
