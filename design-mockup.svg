  <rect x="780" y="140" width="40" height="70" fill="#FFD700" opacity="0.8" filter="url(#glow)" rx="4"/>
  <rect x="805" y="100" width="20" height="50" fill="#FFFFFF" opacity="0.9" filter="url(#glow)" rx="2"/>
  <polygon points="780,140 820,140 805,80" fill="#FFD700" opacity="0.9" filter="url(#glow)"/>
  <!-- Tower windows -->
