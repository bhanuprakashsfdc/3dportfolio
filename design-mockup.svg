  <ellipse cx="800" cy="720" rx="300" ry="40" fill="url(#cloudGrad)" filter="url(#glow)"/>
  <ellipse cx="1300" cy="680" rx="200" ry="35" fill="url(#cloudGrad)" filter="url(#glow)"/>
  <ellipse cx="600" cy="500" rx="150" ry="25" fill="url(#cloudGrad)" opacity="0.8" filter="url(#glow)"/>
  <ellipse cx="1050" cy="480" rx="160" ry="28" fill="url(#cloudGrad)" opacity="0.8" filter="url(#glow)"/>

