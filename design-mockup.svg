  <rect x="495" y="575" width="20" height="25" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <rect x="525" y="575" width="20" height="25" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <rect x="555" y="575" width="20" height="25" rx="2" fill="#FFFFFF" opacity="0.6"/>
  
