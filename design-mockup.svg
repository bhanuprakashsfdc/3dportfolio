    <rect x="820" y="220" width="20" height="30" rx="3"/>
    <rect x="760" y="260" width="20" height="30" rx="3"/>
    <rect x="820" y="260" width="20" height="30" rx="3"/>
    <rect x="760" y="360" width="20" height="30" rx="3"/>
    <rect x="820" y="360" width="20" height="30" rx="3"/>
    <rect x="760" y="420" width="20" height="30" rx="3"/>
